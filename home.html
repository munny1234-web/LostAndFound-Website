<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse items · Lost&amp;Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head><body>
<div id="nav"></div>
<div class="wrap">

  <div class="greet">
    <div><h1 id="hello">Browse items</h1><p class="sub">Everything the community has reported — live.</p></div>
    <div class="statbar">
      <div class="statchip"><div class="n" id="stTotal">–</div><div class="l">Items</div></div>
      <div class="statchip"><div class="n" id="stLost" style="color:var(--lost)">–</div><div class="l">Lost</div></div>
      <div class="statchip"><div class="n" id="stFound" style="color:var(--found)">–</div><div class="l">Found</div></div>
      <div class="statchip"><div class="n" id="stResolved">–</div><div class="l">Reunited</div></div>
    </div>
  </div>

  <div class="layout">
    <!-- ============ SIDEBAR ============ -->
    <aside class="side">
      <div class="card">
        <h3>Quick actions</h3>
        <div style="display:flex;flex-direction:column;gap:9px">
          <a class="btn lost-btn small" href="report.html?type=lost">😢 Report lost item</a>
          <a class="btn small" href="report.html?type=found">🎉 Report found item</a>
          <a class="btn ghost small" href="photo-search.html">🧠 Search by photo</a>
          <a class="btn ghost small" href="map.html">🗺️ View items map</a>
        </div>
      </div>
      <div class="card">
        <h3>Type</h3>
        <div class="filter-list" id="typeList">
          <div class="filter-item active" data-t="all">🗂️ All posts<span class="n" id="cAll"></span></div>
          <div class="filter-item" data-t="lost">😢 Lost<span class="n" id="cLost"></span></div>
          <div class="filter-item" data-t="found">🎉 Found<span class="n" id="cFound"></span></div>
        </div>
      </div>
      <div class="card">
        <h3>Categories</h3>
        <div class="filter-list" id="catList"></div>
      </div>
    </aside>

    <!-- ============ FEED ============ -->
    <main>
      <div class="searchbar" style="max-width:none"><input id="q" placeholder="🔍 Search title, description, location…"></div>
      <div class="results-row">
        <span class="sub" id="resCount"></span>
        <div class="spacer"></div>
        <label style="margin:0;font-size:.82rem;display:flex;align-items:center;gap:8px">Sort
          <select id="sort">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="reward">With reward 🎁</option>
          </select>
        </label>
      </div>
      <div id="list">
        <div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
      </div>
    </main>
  </div>
</div>
<script src="js/app.js"></script>
<script>
initNav("home");
let items = {}, tab = "all", cat = "", q_ = "";

/* greeting with the person's name */
auth.onAuthStateChanged(u => {
  if(u) db.ref("users").child(u.uid).child("name").once("value")
    .then(s => { const n = s.val(); if(n) hello.textContent = "Hello, " + n.split(" ")[0] + " 👋"; });
});

function buildCats(){
  const counts = {};
  Object.values(items).forEach(it => counts[it.category || "Other"] = (counts[it.category || "Other"]||0)+1);
  catList.innerHTML = `<div class="filter-item ${cat===""?"active":""}" data-c="">🗂️ All categories<span class="n">${Object.keys(items).length}</span></div>` +
    CATEGORIES.map(c => `<div class="filter-item ${cat===c?"active":""}" data-c="${c}">${CAT_ICONS[c]} ${c}<span class="n">${counts[c]||0}</span></div>`).join("");
}
catList.onclick = e => { const b = e.target.closest(".filter-item"); if(!b) return; cat = b.dataset.c; buildCats(); render(); };
typeList.onclick = e => { const b = e.target.closest(".filter-item"); if(!b) return;
  typeList.querySelectorAll(".filter-item").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); tab = b.dataset.t; render(); };
q.oninput = e => { q_ = e.target.value.toLowerCase(); render(); };
sort.onchange = render;

function render(){
  let arr = Object.entries(items)
    .filter(([id,it]) => (tab === "all" || it.type === tab))
    .filter(([id,it]) => !cat || it.category === cat)
    .filter(([id,it]) => !q_ || [it.title,it.description,it.location,it.category].join(" ").toLowerCase().includes(q_));
  if(sort.value === "old") arr.sort((a,b) => (a[1].timestamp||0) - (b[1].timestamp||0));
  else if(sort.value === "reward") arr = arr.filter(([id,it]) => it.reward).sort((a,b) => (b[1].timestamp||0) - (a[1].timestamp||0));
  else arr.sort((a,b) => (b[1].timestamp||0) - (a[1].timestamp||0));
  resCount.textContent = arr.length + (arr.length === 1 ? " item" : " items");
  list.innerHTML = arr.length
    ? `<div class="grid">${arr.map(([id,it]) => itemCardHTML(id,it)).join("")}</div>`
    : `<div class="empty"><div class="big">🔍</div>No items match these filters.<br><a href="report.html?type=lost">Report something</a> or clear the filters.</div>`;
}
db.ref("items").on("value", s => {
  items = s.val() || {};
  const all = Object.values(items);
  const lost = all.filter(i => i.type === "lost").length;
  const resolved = all.filter(i => i.status && (i.status.includes("Found") || i.status.includes("Returned"))).length;
  stTotal.textContent = all.length; stLost.textContent = lost;
  stFound.textContent = all.length - lost; stResolved.textContent = resolved;
  cAll.textContent = all.length; cLost.textContent = lost; cFound.textContent = all.length - lost;
  buildCats(); render();
});
</script>
</body></html>
