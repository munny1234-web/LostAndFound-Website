<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · Lost&amp;Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;
  font-size:1.05rem;cursor:pointer;padding:8px 10px;line-height:1;color:var(--ink-soft)}
.pw-toggle:hover{color:var(--ink)}
</style>
</head><body>
<div id="nav"></div>
<div class="wrap-narrow">
  <div class="card pad">
    <h1 style="margin-bottom:4px">Welcome back</h1>
    <p class="sub">Log in to post, claim and chat.</p>
    <label>Email</label><input id="email" type="email" placeholder="you@example.com">
    <label>Password</label>
    <div class="pw-wrap">
      <input id="pass" type="password" placeholder="••••••••">
      <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">👁️</button>
    </div>
    <div style="margin-top:18px"><button class="btn block" id="btnLogin">Log in</button></div>
    <p class="hint" style="margin-top:12px;text-align:center"><a href="#" id="forgot">Forgot password?</a> · New here? <a href="register.html">Create an account</a></p>
    <div id="msg"></div>
  </div>
</div>
<script src="js/app.js"></script>
<script>
initNav("auth");
pwToggle.onclick = () => {
  const showing = pass.type === "text";
  pass.type = showing ? "password" : "text";
  pwToggle.textContent = showing ? "👁️" : "🙈";
  pwToggle.setAttribute("aria-label", showing ? "Show password" : "Hide password");
};

auth.onAuthStateChanged(u => { if(u) location.href = isAdmin(u) ? "admin.html" : (qs("next") || "home.html"); });
btnLogin.onclick = () => {
  msg.innerHTML = "";
  auth.signInWithEmailAndPassword(email.value.trim(), pass.value)
    .catch(e => msg.innerHTML = `<div class="notice err">${esc(e.message)}</div>`);
};
pass.addEventListener("keydown", e => { if(e.key === "Enter") btnLogin.click(); });
forgot.onclick = e => {
  e.preventDefault();
  const em = email.value.trim();
  if(!em) return toast("Type your email first, then tap Forgot password");
  auth.sendPasswordResetEmail(em)
    .then(() => msg.innerHTML = `<div class="notice ok">Reset link sent to ${esc(em)} — check your inbox.</div>`)
    .catch(e2 => msg.innerHTML = `<div class="notice err">${esc(e2.message)}</div>`);
};
</script>
</body></html>
