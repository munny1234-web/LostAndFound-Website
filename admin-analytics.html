<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics · Lost&amp;Found Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dash.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head><body class="dash">
<div id="nav"></div>
<div class="wrap">

  <div class="toolbar">
    <div><div class="crumb"><a href="admin.html">Admin</a> / Analytics</div><h1>Analytics</h1></div>
    <div class="spacer"></div>
    <div class="seg" id="seg">
      <button data-r="7">7D</button>
      <button data-r="30">30D</button>
      <button data-r="90">90D</button>
      <button data-r="365">12M</button>
      <button data-r="all" class="on">All</button>
    </div>
  </div>

  <div class="kpi-grid" id="kpis"></div>

  <div class="panel" style="margin-top:16px">
    <div class="hd"><h3>Post activity</h3>
      <div class="legend"><span><span class="dot" style="background:#F04444"></span>Lost</span><span><span class="dot" style="background:#0E9F6E"></span>Found</span></div>
      <span class="note" id="heroNote"></span></div>
    <div class="bd-i"><canvas id="hero" style="max-height:250px"></canvas></div>
  </div>

  <div class="grid-3" style="margin-top:16px">
    <div class="panel">
      <div class="hd"><h3>Categories</h3><span class="note" id="catNote"></span></div>
      <div class="bd-i" style="padding-top:6px"><table class="dtable" id="catTable"></table></div>
    </div>
    <div class="panel">
      <div class="hd"><h3>Claims funnel</h3><span class="note" id="funnelNote"></span></div>
      <div class="bd-i" id="funnel"></div>
    </div>
  </div>

  <div class="grid-2" style="margin-top:16px">
    <div class="panel">
      <div class="hd"><h3>Weekday pattern</h3><span class="note">posts per day of week</span></div>
      <div class="bd-i"><div class="wk" id="wk"></div></div>
    </div>
    <div class="panel">
      <div class="hd"><h3>Claim verification quality</h3><span class="note">AI similarity score bands</span></div>
      <div class="bd-i" id="quality"></div>
    </div>
  </div>

  <div class="grid-2" style="margin-top:16px;margin-bottom:40px">
    <div class="panel">
      <div class="hd"><h3>Top locations</h3></div>
      <div class="bd-i" style="padding-top:6px"><table class="dtable" id="locTable"></table></div>
    </div>
    <div class="panel">
      <div class="hd"><h3>Top members</h3></div>
      <div class="bd-i" style="padding-top:6px"><table class="dtable" id="memTable"></table></div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script>
initNav("");
const RED = "#F04444", GREEN = "#0E9F6E", INDIGO = "#6C63FF", DEEP = "#4834D4";
let ALL_ITEMS = [], ALL_CLAIMS = [], range = "all", heroChart = null;
const sparks = {};
Chart.defaults.font.family = "Inter";
Chart.defaults.color = "#7A7896";

requireAdmin(async u => {
  const [iS, cS] = await Promise.all([db.ref("items").once("value"), db.ref("claims").once("value")]);
  iS.forEach(c => { ALL_ITEMS.push(c.val()); });
  cS.forEach(c => { ALL_CLAIMS.push(c.val()); });
  build();
});
seg.onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  seg.querySelectorAll("button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  range = b.dataset.r === "all" ? "all" : parseInt(b.dataset.r);
  build();
};

/* ---------- period helpers: current window vs previous equal window ---------- */
const DAY = 86400000;
function inWindow(ts, start, end){ return ts >= start && ts < end; }
function windows(){
  const now = Date.now();
  if(range === "all") return { cur:[0, now], prev:null, label:"all time" };
  return { cur:[now - range*DAY, now], prev:[now - 2*range*DAY, now - range*DAY],
           label: range === 365 ? "last 12 months" : "last " + range + " days" };
}
function deltaChip(cur, prev){
  if(prev === null) return `<span class="delta flat">—</span>`;
  if(prev === 0) return cur > 0 ? `<span class="delta up">▲ new</span>` : `<span class="delta flat">0%</span>`;
  const d = Math.round((cur - prev) / prev * 100);
  if(d > 0) return `<span class="delta up">▲ ${d}%</span>`;
  if(d < 0) return `<span class="delta down">▼ ${Math.abs(d)}%</span>`;
  return `<span class="delta flat">0%</span>`;
}
function sparkline(id, series){
  if(sparks[id]) sparks[id].destroy();
  sparks[id] = new Chart(document.getElementById(id), { type:"line",
    data:{ labels: series.map((_,i) => i), datasets:[{ data: series, borderColor: INDIGO, borderWidth: 2,
      pointRadius: 0, tension: .4, fill: true, backgroundColor: "rgba(108,99,255,.08)" }] },
    options:{ plugins:{ legend:{ display:false }, tooltip:{ enabled:false } },
      scales:{ x:{ display:false }, y:{ display:false } }, maintainAspectRatio:false } });
}

function build(){
  const W = windows();
  const cur = ALL_ITEMS.filter(i => inWindow(i.timestamp||0, W.cur[0], W.cur[1]));
  const prv = W.prev ? ALL_ITEMS.filter(i => inWindow(i.timestamp||0, W.prev[0], W.prev[1])) : null;
  const curC = ALL_CLAIMS.filter(c => inWindow(c.timestamp||0, W.cur[0], W.cur[1]));
  const prvC = W.prev ? ALL_CLAIMS.filter(c => inWindow(c.timestamp||0, W.prev[0], W.prev[1])) : null;

  /* ---------- KPI cards with deltas + sparklines ---------- */
  const lost = cur.filter(i => i.type === "lost").length;
  const found = cur.length - lost;
  const resolved = cur.filter(i => i.status && (i.status.includes("Found") || i.status.includes("Returned"))).length;
  const members = new Set(cur.map(i => i.userId)).size;
  const resRate = cur.length ? Math.round(resolved / cur.length * 100) : 0;
  const prvRes = prv && prv.length ? Math.round(prv.filter(i => i.status && (i.status.includes("Found") || i.status.includes("Returned"))).length / prv.length * 100) : (prv ? 0 : null);

  const K = [
    ["Posts", cur.length, prv ? prv.length : null, true],
    ["Lost reports", lost, prv ? prv.filter(i => i.type === "lost").length : null, true],
    ["Found reports", found, prv ? prv.filter(i => i.type !== "lost").length : null, true],
    ["Claims", curC.length, prvC ? prvC.length : null, true],
    ["Resolution rate", resRate + "%", prvRes, false],
    ["Active members", members, prv ? new Set(prv.map(i => i.userId)).size : null, false]
  ];
  kpis.innerHTML = K.map(([l,v,p,sp],i) => `
    <div class="panel kpi-p">
      <div class="lbl">${l}</div>
      <div class="val">${v}</div>
      ${deltaChip(parseInt(v), p)} <span style="font-size:.7rem;color:var(--mut)">vs prev. period</span>
      ${sp ? `<div class="spark"><canvas id="sp${i}"></canvas></div>` : `<div class="spark"></div>`}
    </div>`).join("");

  /* sparkline series: split window into 12 buckets */
  const mk = arr => {
    if(range === "all") return [];
    const buckets = new Array(12).fill(0);
    const span = (W.cur[1] - W.cur[0]) / 12;
    arr.forEach(x => { const b = Math.floor(((x.timestamp||0) - W.cur[0]) / span); if(b >= 0 && b < 12) buckets[b]++; });
    return buckets;
  };
  if(range !== "all"){
    sparkline("sp0", mk(cur));
    sparkline("sp1", mk(cur.filter(i => i.type === "lost")));
    sparkline("sp2", mk(cur.filter(i => i.type !== "lost")));
    sparkline("sp3", mk(curC));
  }

  /* ---------- hero chart ---------- */
  heroNote.textContent = W.label;
  const monthly = range === 365 || range === "all";
  let keys = [], labels = [];
  if(monthly){
    let start = new Date(); start.setMonth(start.getMonth() - 11); start.setDate(1);
    if(range === "all" && ALL_ITEMS.length){
      const first = new Date(Math.min(...ALL_ITEMS.map(i => i.timestamp || Date.now())));
      start = new Date(first.getFullYear(), first.getMonth(), 1);
    }
    const c = new Date(start), now = new Date();
    while(c <= now){ keys.push(c.getFullYear() + "-" + c.getMonth());
      labels.push(c.toLocaleDateString([], { month:"short", year:"2-digit" })); c.setMonth(c.getMonth() + 1); }
  } else {
    for(let i = range - 1; i >= 0; i--){
      const d = new Date(); d.setDate(d.getDate() - i);
      keys.push(d.toDateString());
      labels.push(d.toLocaleDateString([], { day:"numeric", month:"short" }));
    }
  }
  const kf = ts => monthly ? new Date(ts).getFullYear() + "-" + new Date(ts).getMonth() : new Date(ts).toDateString();
  const lostS = keys.map(() => 0), foundS = keys.map(() => 0);
  (range === "all" ? ALL_ITEMS : cur).forEach(it => {
    const idx = keys.indexOf(kf(it.timestamp||0));
    if(idx >= 0){ if(it.type === "lost") lostS[idx]++; else foundS[idx]++; }
  });
  if(heroChart) heroChart.destroy();
  heroChart = new Chart(hero, { type:"line",
    data:{ labels, datasets:[
      { label:"Lost", data:lostS, borderColor:RED, backgroundColor:"rgba(240,68,68,.06)", fill:true, tension:.3, borderWidth:2, pointRadius:0, pointHoverRadius:4 },
      { label:"Found", data:foundS, borderColor:GREEN, backgroundColor:"rgba(14,159,110,.06)", fill:true, tension:.3, borderWidth:2, pointRadius:0, pointHoverRadius:4 }
    ]},
    options:{ interaction:{ mode:"index", intersect:false }, plugins:{ legend:{ display:false } },
      scales:{ x:{ grid:{ display:false }, ticks:{ maxTicksLimit: 10 } },
               y:{ beginAtZero:true, ticks:{ precision:0 }, grid:{ color:"#F1F0F8" }, border:{ display:false } } } } });

  /* ---------- category table ---------- */
  const byCat = {};
  cur.forEach(i => { const c = i.category || "Other";
    if(!byCat[c]) byCat[c] = { lost:0, found:0 };
    byCat[c][i.type === "lost" ? "lost" : "found"]++; });
  const cats = Object.entries(byCat).sort((a,b) => (b[1].lost+b[1].found)-(a[1].lost+a[1].found));
  catNote.textContent = W.label;
  catTable.innerHTML = `<tr><th>Category</th><th class="num">Lost</th><th class="num">Found</th><th class="num">Total</th><th>Share of posts</th></tr>` +
    (cats.length ? cats.map(([c,v]) => {
      const t = v.lost + v.found, pc = cur.length ? Math.round(t/cur.length*100) : 0;
      return `<tr><td>${CAT_ICONS[c]||""} ${esc(c)}</td>
        <td class="num" style="color:${RED}">${v.lost||"·"}</td>
        <td class="num" style="color:${GREEN}">${v.found||"·"}</td>
        <td class="num"><b>${t}</b></td>
        <td><div class="share"><div class="trk">
          <div class="fl" style="width:${pc*(v.lost/t)}%;background:${RED}"></div>
          <div class="fl" style="width:${pc*(v.found/t)}%;background:${GREEN}"></div>
        </div><span class="pc">${pc}%</span></div></td></tr>`;
    }).join("") : `<tr><td colspan="5"><div class="empty-s">No posts in this period.</div></td></tr>`);

  /* ---------- claims funnel ---------- */
  const cp = { P:0, A:0, R:0 };
  curC.forEach(c => { const s = c.status || "";
    if(s.includes("Approved")) cp.A++; else if(s.includes("Rejected")) cp.R++; else cp.P++; });
  const tc = curC.length || 0;
  funnelNote.textContent = W.label;
  const fr = (label, n, color) => {
    const w = tc ? Math.max(6, Math.round(n/tc*100)) : 0;
    return `<div class="funnel-row"><span class="lbl">${label}</span>
      <div class="bar"><div style="width:${n ? w : 0}%;background:${color}">${n||""}</div></div>
      <span class="pct">${tc ? Math.round(n/tc*100) : 0}%</span></div>`;
  };
  funnel.innerHTML = tc ? (
    fr("Submitted", tc, INDIGO) + fr("Approved", cp.A, GREEN) + fr("Pending", cp.P, "#F59E0B") + fr("Rejected", cp.R, RED) +
    `<p style="font-size:.8rem;color:var(--mut);margin-top:4px">Approval rate <b style="color:var(--txt)">${Math.round(cp.A/tc*100)}%</b> of all claims in period.</p>`
  ) : `<div class="empty-s">No claims in this period.</div>`;

  /* ---------- weekday pattern (clean CSS bars) ---------- */
  const dows = [0,0,0,0,0,0,0];
  cur.forEach(i => dows[new Date(i.timestamp||0).getDay()]++);
  const maxD = Math.max(...dows, 1);
  wk.innerHTML = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d,i) => `
    <div class="col"><div class="b ${dows[i] === maxD && dows[i] > 0 ? "max" : ""}" style="height:${Math.max(6, dows[i]/maxD*100)}%">
      <span class="v">${dows[i]||""}</span></div><span class="d">${d}</span></div>`).join("");

  /* ---------- verification quality band ---------- */
  const q = [0,0,0];
  curC.forEach(c => { const p = c.aiMatchPercentage ?? ((c.hiddenMatchScore||0)*100);
    q[p >= 75 ? 2 : p >= 45 ? 1 : 0]++; });
  const tq = q[0]+q[1]+q[2];
  quality.innerHTML = tq ? `
    <div class="qband">
      ${q[0] ? `<div style="width:${q[0]/tq*100}%;background:${RED}">${q[0]}</div>` : ""}
      ${q[1] ? `<div style="width:${q[1]/tq*100}%;background:#F59E0B">${q[1]}</div>` : ""}
      ${q[2] ? `<div style="width:${q[2]/tq*100}%;background:${GREEN}">${q[2]}</div>` : ""}
    </div>
    <div class="legend">
      <span><span class="dot" style="background:${RED}"></span>Weak (&lt;45%)</span>
      <span><span class="dot" style="background:#F59E0B"></span>Partial (45–74%)</span>
      <span><span class="dot" style="background:${GREEN}"></span>Strong (75%+)</span>
    </div>
    <p style="font-size:.82rem;color:var(--mut);margin-top:12px"><b style="color:var(--txt)">${Math.round(q[2]/tq*100)}%</b> of claims scored a strong AI match — higher is healthier.</p>`
    : `<div class="empty-s">No claims in this period.</div>`;

  /* ---------- locations + members tables ---------- */
  const locs = {};
  cur.forEach(i => { const l = (i.location||"").split(",")[0].trim(); if(!l) return;
    if(!locs[l]) locs[l] = { lost:0, found:0 };
    locs[l][i.type === "lost" ? "lost" : "found"]++; });
  const topL = Object.entries(locs).sort((a,b) => (b[1].lost+b[1].found)-(a[1].lost+a[1].found)).slice(0,7);
  locTable.innerHTML = `<tr><th>Location</th><th class="num">Lost</th><th class="num">Found</th><th class="num">Total</th></tr>` +
    (topL.length ? topL.map(([l,v]) => `<tr><td>${esc(l)}</td>
      <td class="num" style="color:${RED}">${v.lost||"·"}</td>
      <td class="num" style="color:${GREEN}">${v.found||"·"}</td>
      <td class="num"><b>${v.lost+v.found}</b></td></tr>`).join("")
    : `<tr><td colspan="4"><div class="empty-s">No location data in this period.</div></td></tr>`);

  const posters = {};
  cur.forEach(i => { const k = i.userName || "Unknown"; posters[k] = (posters[k]||0)+1; });
  const topP = Object.entries(posters).sort((a,b) => b[1]-a[1]).slice(0,7);
  const maxP = topP[0] ? topP[0][1] : 1;
  memTable.innerHTML = `<tr><th>Member</th><th class="num">Posts</th><th>Share</th></tr>` +
    (topP.length ? topP.map(([n,c]) => `<tr><td>${esc(n)}</td><td class="num"><b>${c}</b></td>
      <td><div class="share"><div class="trk"><div class="fl" style="width:${Math.round(c/maxP*100)}%;background:${INDIGO}"></div></div>
      <span class="pc">${cur.length ? Math.round(c/cur.length*100) : 0}%</span></div></td></tr>`).join("")
    : `<tr><td colspan="3"><div class="empty-s">No posts in this period.</div></td></tr>`);
}
</script>
</body></html>
