<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin login · Lost&amp;Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head><body>
<div id="nav"></div>
<div class="wrap-narrow">
  <div class="card pad">
    <span class="tag resolved">Admin</span>
    <h1 style="margin:10px 0 4px">Admin login</h1>
    <p class="sub">Restricted — only the administrator account can enter.</p>
    <label>Admin email</label><input id="email" type="email">
    <label>Password</label><input id="pass" type="password">
    <div style="margin-top:18px"><button class="btn block" id="btnLogin">Enter dashboard</button></div>
    <div id="msg"></div>
  </div>
</div>
<script src="js/app.js"></script>
<script>
initNav("");
btnLogin.onclick = () => {
  const e = email.value.trim();
  if(e.toLowerCase() !== ADMIN_EMAIL){ msg.innerHTML = `<div class="notice err">This is not the admin account.</div>`; return; }
  auth.signInWithEmailAndPassword(e, pass.value)
    .then(() => location.href = "admin.html")
    .catch(err => msg.innerHTML = `<div class="notice err">${esc(err.message)}</div>`);
};
</script>
</body></html>
